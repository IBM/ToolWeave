[project]
name = "toolweave"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "filelock==3.18.0",
    "httpx==0.28.1",
    "ibm-watsonx-ai==1.3.13",
    "langchain-core==0.3.74",
    "langgraph==0.6.4",
    "matplotlib==3.10.5",
    "natsort==8.4.0",
    "networkx==3.5",
    "openai==1.99.6",
    "python-dotenv==1.1.1",
    "pyvis==0.3.2",
    "pyyaml==6.0.2",
    "rapidfuzz==3.13.0",
    "requests==2.32.4",
    "sentence-transformers>=5.1.0",
    "sparqlwrapper==2.0.0",
    "torch==2.8.0",
    "tqdm==4.67.1",
    "wikipedia-api==0.8.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
