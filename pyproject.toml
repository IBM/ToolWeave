[project]
name = "toolweave"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "filelock>=3.20.3",
    "httpx==0.28.1",
    "ibm-watsonx-ai==1.3.13",
    "langchain-core>=1.2.22",
    "langgraph>=1.0.10",
    "matplotlib==3.10.5",
    "natsort==8.4.0",
    "networkx==3.5",
    "openai==1.99.6",
    "python-dotenv>=1.2.2",
    "pyvis==0.3.2",
    "pyyaml==6.0.2",
    "rapidfuzz==3.13.0",
    "requests>=2.33.0",
    "sentence-transformers>=5.1.0",
    "sparqlwrapper==2.0.0",
    "torch>=2.13.0",
    "tqdm==4.67.1",
    "wikipedia-api==0.8.1",
]

[tool.uv]
# Floors for transitive dependencies with published security fixes (see issue #2).
constraint-dependencies = [
    "anyio>=4.14.2",
    "fonttools>=4.60.2",
    "idna>=3.15",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.18",
    "orjson>=3.11.6",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "setuptools>=83.0.0",
    "transformers>=5.10.0",
    "urllib3>=2.7.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
