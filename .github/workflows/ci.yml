name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify install and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # api_synthesizer.core.generator loads all-MiniLM-L6-v2 at import time,
      # so cache it rather than re-downloading ~90MB on every run.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      # requirements.txt is generated from uv.lock. Dependabot sometimes edits
      # one without the other, which leaves the vulnerable version pinned in
      # the lock and the alert open (see #7 / PR #8).
      - name: Check requirements.txt matches uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project \
            --quiet -o /tmp/requirements.expected
          # Ignore comments: uv records the output path in the file header.
          if ! diff -u <(grep -v '^#' requirements.txt) \
                       <(grep -v '^#' /tmp/requirements.expected); then
            echo "::error::requirements.txt is out of sync with uv.lock. Run: uv lock && uv export --format requirements-txt --no-hashes --no-emit-project -o requirements.txt"
            exit 1
          fi

      - name: Run smoke test
        run: uv run python .github/scripts/smoke_test.py

  automerge:
    name: Auto-merge Dependabot security updates
    needs: verify
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Dependabot opens PRs here only for security fixes, and this job runs
      # only after `verify` passes. Major-version bumps are merged too:
      # security fixes often ship as majors (e.g. Pillow 13), and excluding
      # them silently left a critical CVE unmerged (see issue #7).
      - name: Merge
        run: |
          gh pr merge --squash --auto "$PR_URL" \
            || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
